name: MemoryStore
options:
  bundleIdPrefix: com.memorystore
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
packages: {}
targets:
  MemoryStore:
    type: application
    platform: iOS
    sources:
      - path: MemoryStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memorystore.app
        INFOPLIST_FILE: MemoryStore/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: MemoryStore/Info.plist
      properties:
        CFBundleDisplayName: MemoryStore
        NSPhotoLibraryUsageDescription: MemoryStore 需要访问照片以自动备份到您的私人服务器；上传成功后保留本机原片，可在 App 内手动清理已备份项。
        NSPhotoLibraryAddUsageDescription: 允许将已备份照片重新保存到系统相册。
        NSLocalNetworkUsageDescription: MemoryStore 需要访问家中服务器以上传和浏览照片。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
